[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-po-cashflow"
version = "0.1.6"
description = "InvenTree open purchase order cashflow matrix by project code, currency and target month"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Per Vices Corporation"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: InvenTree",
]

[project.entry-points.inventree_plugins]
PurchaseOrderCashflowPlugin = "po_cashflow.plugin:PurchaseOrderCashflowPlugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["po_cashflow*"]
